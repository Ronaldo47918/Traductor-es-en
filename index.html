<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traductor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="estilos.css?v=2">
</head>

<body>

    <main class="container py-4 py-md-5">
        <header class="d-flex justify-content-end mb-4">
            <label class="cosmic-toggle" for="themeToggle">
                <input
                    class="toggle"
                    type="checkbox"
                    id="themeToggle"
                    aria-label="Activar modo oscuro"
                    aria-describedby="themeDescription"
                >
                <span class="slider" aria-hidden="true">
                    <span class="cosmos"></span>
                    <span class="energy-line"></span>
                    <span class="energy-line"></span>
                    <span class="energy-line"></span>
                    <span class="particles">
                        <span class="particle"></span>
                        <span class="particle"></span>
                        <span class="particle"></span>
                        <span class="particle"></span>
                        <span class="particle"></span>
                        <span class="particle"></span>
                    </span>
                    <span class="toggle-orb">
                        <span class="inner-orb"></span>
                        <span class="ring"></span>
                    </span>
                </span>
            </label>
            <span id="themeDescription" class="visually-hidden" aria-live="polite">Modo claro</span>
        </header>

        <section class="row justify-content-center">
            <div class="col-12 col-xl-10">
                <h1 class="text-center mb-4">Traductor</h1>

                <div class="row g-3 g-lg-4 align-items-stretch">
                    <div class="col-12 col-md-6">
                        <div class="idioma">
                            <label class="form-label fw-semibold" for="textoEntrada">Español</label>
                            <textarea
                                class="form-control"
                                id="textoEntrada"
                                rows="8"
                                placeholder="Escribe un texto para traducir"
                            ></textarea>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="idioma">
                            <label class="form-label fw-semibold" for="textoSalida">Inglés</label>
                            <textarea
                                class="form-control"
                                id="textoSalida"
                                rows="8"
                                readonly
                                aria-label="Traducción al inglés"
                            ></textarea>
                        </div>
                    </div>

                    <div class="col-12 d-flex justify-content-center">
                        <button class="btn btn-primary btn-translate px-4" id="btnTraducir" type="button" aria-busy="false">
                            Traducir
                        </button>
                    </div>
                </div>

                <p id="estado" class="text-center mt-4 mb-0" role="status" aria-live="polite" aria-atomic="true">
                    Modelo desconectado. Pulsa «Traducir» para conectarlo.
                </p>
            </div>
        </section>
    </main>

    <script type="module" src="app.mjs"></script>

</body>
</html>
